name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly: Autobahn against the current edge compiler, whatever changed.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  # Which areas a pull request touches, so slow conformance suites run
  # only when they can be affected. Pushes to main, the nightly run and
  # manual runs always run them.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      websocket: ${{ steps.filter.outputs.websocket }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            websocket:
              - 'src/websocket/**'
              - 'src/http1/**'
              - 'src/pipeline.bt'
              - 'src/connection_handler.bt'
              - 'src/buccaneer_config.bt'
              - 'src/compression.bt'
              - 'test/websocket/**'
              - 'test/fixtures/**'
              - 'beamtalk.toml'
              - 'beamtalk.lock'
              - 'Justfile'
              - '.github/workflows/ci.yml'

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          # For the Bandit baseline of the bench and stress smoke steps.
          elixir-version: "1.20.1"

      - name: Install Beamtalk
        # edge tracks beamtalk main per merge; buccaneer and catalina depend on unreleased stdlib work (BT-3957)
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --edge --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Format check
        run: just fmt

      - name: Lint
        run: just lint
        continue-on-error: true

      - name: Build
        run: just build

      - name: Test
        run: just test

      # Phase 0 spikes: loopback sockets and timing. The tests must pass;
      # the numbers they print are informational.
      - name: Spikes
        run: just spikes

      # BT-4086: short versions of `just bench` and `just stress` (the
      # release gate's harness). Shared runners make the numbers noisy and
      # the timing-bound stress checks flaky, so both are informational.
      - name: Bench smoke
        run: just bench-smoke
        continue-on-error: true

      - name: Stress smoke
        run: just stress-smoke
        continue-on-error: true

  # Phase 4: Autobahn Testsuite fuzzingclient against the echo server.
  # Required check (BT-4084 promoted it once green). On a pull request it
  # runs only when the WebSocket path changes (see `changes`); a skipped
  # run counts as passing. Needs docker (present on ubuntu-latest) and the
  # AUTOBAHN=1 gate in test/websocket/autobahn_test.bt.
  autobahn:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.websocket == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"

      - name: Install Beamtalk
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --edge --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Build
        run: just build

      - name: Autobahn Testsuite
        run: just autobahn

  # Phase 6: h2spec conformance over TLS/ALPN h2.
  # Non-blocking until green (BT-4085), then promote by dropping
  # continue-on-error. Needs docker (present on ubuntu-latest) or a
  # local h2spec binary, and the H2SPEC=1 gate in
  # test/http2/h2spec_test.bt.
  h2spec:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"

      - name: Install Beamtalk
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --edge --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Build
        run: just build

      - name: h2spec
        run: just h2spec
