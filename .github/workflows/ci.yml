name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.5"
          # For the Bandit baseline of the spike bench smoke step.
          elixir-version: "1.20.1"

      - name: Install Beamtalk
        # edge tracks beamtalk main per merge; buccaneer and catalina depend on unreleased stdlib work (BT-3957)
        run: |
          curl -fsSL https://beamtalk.dev/install.sh | sudo sh -s -- --edge --prefix /usr/local
          beamtalk --version

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Format check
        run: just fmt

      - name: Lint
        run: just lint
        continue-on-error: true

      - name: Build
        run: just build

      - name: Test
        run: just test

      # Phase 0 spikes: loopback sockets and timing. The tests must pass;
      # the numbers they print are informational.
      - name: Spikes
        run: just spikes

      # Spike 1's three-way bench, one short round. Shared runners make the
      # numbers noisy, so this is informational only.
      - name: Spike bench smoke
        run: just spike-bench --rows smoke
        continue-on-error: true
