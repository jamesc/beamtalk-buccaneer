[package]
name = "buccaneer"
version = "0.1.0"
description = "Pure-Beamtalk HTTP server built on Catalina, a port of Bandit"

[dependencies]
catalina = "0.2.1"

# Every class is `typed`; a type warning fails the build (as Catalina's AGENTS.md).
[diagnostics]
type = "error"
type-annotation = "error"
dnu = "error"
