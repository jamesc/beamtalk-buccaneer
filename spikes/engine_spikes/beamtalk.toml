# Phase 0 spikes 1-4 (HTTP/1 parse cost, exchange state, blocking work,
# byte codecs). A separate package so the throwaway spike classes compile
# in package mode, as the shipped library does — never as test fixtures.
[package]
name = "engine_spikes"
version = "0.0.0"
description = "Buccaneer Phase 0 spikes 1-4 (not published)"

[dependencies]
catalina = "0.1.0"

[diagnostics]
type = "error"
type-annotation = "error"
dnu = "error"
